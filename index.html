<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: white;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -10;
            pointer-events: none;
            display: grid;
            opacity: 0.15;
        }

        .bg-tile {
            background-image: url('jwe.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            width: 100%;
            height: 100%;
        }

        #emoji-container {
            display: none;
        }

        #loading-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 100;
        }

        .apple-logo {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.1);
            }
        }

        .loading-text {
            font-size: 1.2rem;
            color: #555;
            letter-spacing: 3px;
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% {
                content: '';
            }
            40% {
                content: '.';
            }
            60% {
                content: '..';
            }
            80%, 100% {
                content: '...';
            }
        }

        #hint {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 0.8rem;
            color: #999;
            z-index: 50;
        }

        #floating-box {
            position: fixed;
            width: 300px;
            height: 200px;
            background: linear-gradient(45deg, #FF0000, #00FF00, #0000FF, #FFFF00);
            border: 3px solid #000;
            border-radius: 10px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            font-family: Arial, sans-serif;
            cursor: move;
        }

        #floating-box h1 {
            font-size: 2rem;
            margin: 0;
            animation: flash-text 0.1s infinite;
        }

        #floating-box p {
            margin: 10px 0 0 0;
            font-size: 1.2rem;
        }

        @keyframes flash-text {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div id="background"></div>
    <div id="emoji-container"></div>
    
    <div id="floating-box">
        <h1>⚠️ ALERT ⚠️</h1>
        <p>Can't escape me!</p>
    </div>
    
    <div id="loading-container">
        <div class="apple-logo">🍎</div>
        <div class="loading-text">Loading</div>
    </div>

    <div id="hint">Press P to stop</div>

    <script>
        let isRunning = true;
        let isFullscreen = false;
        let gridSize = 1;
        let floatingWindow = null;
        let windowX = 100;
        let windowY = 100;
        let windowVX = 3;
        let windowVY = 3;
        const WINDOW_WIDTH = 300;
        const WINDOW_HEIGHT = 200;

        // Create floating bouncing window
        function createFloatingWindow() {
            const box = document.getElementById('floating-box');
            box.style.display = 'flex';
        }

        // Bounce the floating window around
        function bounceWindow() {
            const box = document.getElementById('floating-box');
            
            if (box.style.display === 'none') {
                if (isRunning) {
                    createFloatingWindow();
                }
                return;
            }

            windowX += windowVX;
            windowY += windowVY;

            // Bounce off edges
            if (windowX <= 0 || windowX + WINDOW_WIDTH >= window.innerWidth) {
                windowVX *= -1;
            }
            if (windowY <= 0 || windowY + WINDOW_HEIGHT >= window.innerHeight) {
                windowVY *= -1;
            }

            box.style.left = windowX + 'px';
            box.style.top = windowY + 'px';
        }

        // Update background grid
        function updateBackgroundGrid() {
            const bg = document.getElementById('background');
            bg.innerHTML = '';
            bg.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            bg.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;
            
            for (let i = 0; i < gridSize * gridSize; i++) {
                const tile = document.createElement('div');
                tile.className = 'bg-tile';
                bg.appendChild(tile);
            }
        }

        // Increase grid size every 0.1 seconds
        function increaseGridSize() {
            if (!isRunning) return;
            gridSize++;
            updateBackgroundGrid();
        }

        // Random character generator for password
        function generateRandomString(length) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // Ask to save password
        function triggerPasswordPrompt() {
            const username = generateRandomString(20);
            const password = generateRandomString(20);
            
            const input = document.createElement('input');
            input.type = 'password';
            input.value = password;
            input.style.display = 'none';
            document.body.appendChild(input);
            
            // Trigger browser password save
            setTimeout(() => {
                input.focus();
                input.select();
            }, 100);
        }

        // Flash background colors every 0.05 seconds
        function flashColors() {
            if (!isRunning) return;

            const colors = [
                '#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF', '#00FFFF',
                '#FF6600', '#0066FF', '#FF0066', '#66FF00', '#FF0099', '#00FF99',
                '#9900FF', '#FF9900', '#00FF66', '#6600FF', '#FFFF00', '#FF00FF'
            ];
            
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            document.getElementById('background').style.backgroundColor = randomColor;
        }

        // Toggle fullscreen every 1 second
        function toggleFullscreen() {
            if (!isRunning) return;

            if (!isFullscreen) {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.mozRequestFullScreen) {
                    elem.mozRequestFullScreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
                isFullscreen = true;
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                isFullscreen = false;
            }
        }

        // Flash colors every 0.05 seconds
        setInterval(flashColors, 50);

        // Increase grid size every 0.1 seconds
        setInterval(increaseGridSize, 100);

        // Bounce window every 50ms
        setInterval(bounceWindow, 50);

        // Toggle fullscreen every 0.05 seconds
        setInterval(toggleFullscreen, 50);

        // Trigger password prompt every 1 second
        setInterval(() => {
            if (isRunning) {
                triggerPasswordPrompt();
            }
        }, 1000);

        // Listen for P key to stop
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'p') {
                isRunning = false;
                
                // Hide floating box
                const box = document.getElementById('floating-box');
                box.style.display = 'none';
                
                // Exit fullscreen if active
                if (isFullscreen) {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    } else if (document.mozCancelFullScreen) {
                        document.mozCancelFullScreen();
                    } else if (document.msExitFullscreen) {
                        document.msExitFullscreen();
                    }
                }
                
                // Reset grid and colors
                gridSize = 1;
                document.getElementById('background').style.backgroundColor = 'transparent';
                updateBackgroundGrid();
                
                // Update hint
                document.getElementById('hint').textContent = 'Stopped! Press P again to restart.';
                
                // Allow restart
                isRunning = false;
            }
        });

        // Before unload, ask for confirmation
        window.addEventListener('beforeunload', (e) => {
            if (isRunning) {
                e.preventDefault();
                e.returnValue = '';
                return '';
            }
        });

        // Trigger password prompt after 1 second
        setTimeout(() => {
            triggerPasswordPrompt();
        }, 1000);

        // Allow recreation of window from popup
        window.recreateFloatingWindow = function() {
            if (isRunning) {
                createFloatingWindow();
            }
        };

        // Initialize background grid on load
        window.addEventListener('load', () => {
            updateBackgroundGrid();
            // Create floating window after a short delay
            setTimeout(() => {
                if (isRunning) {
                    createFloatingWindow();
                }
            }, 500);
        });

        // Also initialize immediately
        updateBackgroundGrid();
        createFloatingWindow();
    </script>
</body>
</html>
